name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile application modules without launching them
        run: python -m py_compile main.py reisync_core.py lyrics_console.py theme_arts.py
      - name: Test mocked Spotify, WASAPI and lyric synchronization
        run: python -m unittest discover -s tests -v
